name: ConsumerApp
options:
  bundleIdPrefix: com.apptolast.menufrontend
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig
settings:
  base:
    # The "Compile Kotlin Framework" run script writes the framework into the build
    # dir, which Xcode's script sandbox would otherwise block.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
targets:
  ConsumerApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iosApp/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MenuFrontend
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
          # iPhone-only (1). Avoids iPad's all-orientations multitasking requirement and the need for
          # iPad screenshots. The store listing + screenshots are iPhone-only.
        TARGETED_DEVICE_FAMILY: "1"
          # Sign in with Apple capability (com.apple.developer.applesignin).
        CODE_SIGN_ENTITLEMENTS: iosApp/ConsumerApp.entitlements
        DEVELOPMENT_TEAM: $(TEAM_ID)
        # Link the Kotlin/Native framework produced by :consumerApp (baseName = "ConsumerApp").
        OTHER_LDFLAGS: [$(inherited), -framework, ConsumerApp]
      configs:
          # Debug: Xcode-managed automatic signing for quick local device runs.
          Debug:
              CODE_SIGN_STYLE: Automatic
          # Release: manual signing with the match App Store certificate + provisioning profile
          # (matches the FamilyFilm/Municion setup; required for TestFlight/App Store builds).
          Release:
              CODE_SIGN_STYLE: Manual
              CODE_SIGN_IDENTITY: "Apple Distribution"
              PROVISIONING_PROFILE_SPECIFIER: match AppStore com.apptolast.menufrontend
    preBuildScripts:
      # Builds + embeds the Compose Multiplatform framework before compiling Swift.
      # embedAndSignAppleFrameworkForXcode reads Xcode's env (CONFIGURATION, SDK_NAME,
      # ARCHS, BUILT_PRODUCTS_DIR…) and drops ConsumerApp.framework where Xcode links it.
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :consumerApp:embedAndSignAppleFrameworkForXcode

    # UI test bundle used only by fastlane snapshot to capture App Store screenshots (simulator, Debug).
  ConsumerAppUITests:
      type: bundle.ui-testing
      platform: iOS
      sources:
          -   path: ConsumerAppUITests
      dependencies:
          -   target: ConsumerApp
      settings:
          base:
              DEVELOPMENT_TEAM: $(TEAM_ID)
              # The project xcconfig forces PRODUCT_NAME=MenuFrontend on EVERY target. Override it here so
              # this test bundle's Swift module is uniquely named — otherwise it emits its own
              # MenuFrontend.swiftmodule and collides with the app's ("Multiple commands produce …swiftmodule").
              PRODUCT_NAME: ConsumerAppUITests
              PRODUCT_BUNDLE_IDENTIFIER: com.apptolast.menufrontend.uitests
              CODE_SIGN_STYLE: Automatic
              GENERATE_INFOPLIST_FILE: YES

# Shared scheme so fastlane/gym (and CI, where xcuserdata schemes don't exist) can build & archive.
schemes:
    ConsumerApp:
        build:
            targets:
                ConsumerApp: all
        run:
            config: Debug
        test:
            config: Debug
            targets:
                - ConsumerAppUITests
        profile:
            config: Release
        analyze:
            config: Debug
        archive:
            config: Release

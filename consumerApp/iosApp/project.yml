name: ConsumerApp
options:
  bundleIdPrefix: com.apptolast.menufrontend
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig
settings:
  base:
    # The "Compile Kotlin Framework" run script writes the framework into the build
    # dir, which Xcode's script sandbox would otherwise block.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ConsumerApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iosApp/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MenuFrontend
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        # Link the Kotlin/Native framework produced by :consumerApp (baseName = "ConsumerApp").
        OTHER_LDFLAGS: [$(inherited), -framework, ConsumerApp]
    preBuildScripts:
      # Builds + embeds the Compose Multiplatform framework before compiling Swift.
      # embedAndSignAppleFrameworkForXcode reads Xcode's env (CONFIGURATION, SDK_NAME,
      # ARCHS, BUILT_PRODUCTS_DIR…) and drops ConsumerApp.framework where Xcode links it.
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :consumerApp:embedAndSignAppleFrameworkForXcode

name: Deploy iOS (TestFlight)

# Tag-driven: push a v* tag (or run manually) to build and upload the app to TestFlight.
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to release (e.g. v1.2.3)"
                required: true

concurrency:
    group: deploy-ios-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: macos-15
        environment: release
        steps:
            -   uses: actions/checkout@v4

            -   uses: maxim-lobanov/setup-xcode@v1
                with:
                    xcode-version: latest-stable

            -   uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: "17"

            -   uses: ruby/setup-ruby@v1
                with:
                    ruby-version: "3.3"
                    bundler-cache: true

            -   name: Install XcodeGen
                run: brew install xcodegen

            -   name: Generate Xcode project
                working-directory: consumerApp/iosApp
                run: xcodegen generate

            -   name: Write GoogleService-Info.plist
                run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 --decode > consumerApp/iosApp/iosApp/GoogleService-Info.plist

            -   name: Render local.properties
                run: |
                    cat > local.properties <<EOF
                    FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
                    FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
                    USE_FIRESTORE=true
                    GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
                    EOF

            -   name: Fastlane release (TestFlight)
                working-directory: consumerApp/iosApp
                env:
                    RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
                    APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
                    APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
                    APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
                    MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
                    MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
                    MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
                    FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
                    FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
                    APPLE_ID: ${{ secrets.APPLE_ID }}
                run: bundle exec fastlane ios release_from_tag

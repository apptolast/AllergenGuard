apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-restart-sa
  namespace: apptolast-menus-admin-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-restart-role
  namespace: apptolast-menus-admin-dev
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-restart-rolebinding
  namespace: apptolast-menus-admin-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout-restart-role
subjects:
  - kind: ServiceAccount
    name: rollout-restart-sa
    namespace: apptolast-menus-admin-dev
